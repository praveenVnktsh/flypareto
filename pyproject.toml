[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flypareto"
version = "0.1.0"
description = "Full-connectome simulation and Pareto analysis for the Drosophila MaleCNS"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Praveen Venkatesh"}]
dependencies = [
  "numpy>=1.24,<3",
  "pyarrow>=14,<22",
  "scipy>=1.10,<2",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.7,<4", "pandas>=2,<3"]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
flypareto = "flypareto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
